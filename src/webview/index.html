<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{cspSource}} 'unsafe-inline'; script-src {{cspSource}} 'unsafe-inline';" />
  <title>SVG Preview</title>
  <link rel="stylesheet" href="{{stylesUri}}" />
</head>

<body>
  <div class="preview-wrapper">
    <div class="preview-header">
      <div class="preview-header-title">
        <span id="zoomLevel" class="zoom-level">(Zoom 100%)</span>
        <span id="svgSize" class="svg-size"></span>
      </div>
      <div class="preview-header-controls">
        <div class="ico-wrapper selected" id="zoomWrapper" title="Zoom Mode">
          <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <circle cx="10" cy="10" r="7" style="fill:none;;stroke-width:1.5" />
            <path d="m15.2,15.2 5,5" style="stroke-width:2;stroke-linecap:round" />
          </svg>
        </div>
        <div class="optimize-wrapper ico-wrapper" id="optimizeWrapper" title="Optimize SVG">
          <svg fill="none" width="18" height="18" stroke="currentColor" class="optimize-icon" viewBox="0 0 24 24">
            <path stroke="none" d="M0 0h24v24H0z" />
            <path d="M13 3v7h6l-8 11v-7H5z" />
          </svg>
        </div>
        <div class="toggle-dark-bg-wrapper ico-wrapper" id="toggleDarkBgWrapper" title="Toggle dark background">
          <svg id="toggleDarkBg" fill="none" width="18" height="18" stroke="currentColor" class="toggle-dark-bg" viewBox="0 0 24 24">
            <path stroke="none" d="M0 0h24v24H0z" />
            <path d="M3 12a9 9 0 1 0 18 0 9 9 0 1 0-18 0" />
            <path d="M12 17a5 5 0 0 0 0-10z" />
          </svg>
        </div>
        <div class="center-icon-wrapper ico-wrapper" id="centerIconWrapper" title="Center SVG">
          <svg fill="none" width="18" height="18" stroke="currentColor" class="center-icon" viewBox="0 0 24 24">
            <path stroke="none" d="M0 0h24v24H0z" />
            <path d="M3 12a9 9 0 1 0 18 0 9 9 0 0 0-18 0" />
            <path d="M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6m0-6v2m0 14v2m-9-9h2m14 0h2" />
          </svg>
        </div>
        <div class="color-picker-wrapper ico-wrapper" id="colorPickerWrapper" title="Change currentColor value">
          <svg fill="none" width="18" height="18" stroke="currentColor" class="color-picker-icon" viewBox="0 0 24 24">
            <path stroke="none" d="M0 0h24v24H0z" />
            <path d="M12 21a9 9 0 0 1 0-18c4.97 0 9 3.582 9 8 0 1.06-.474 2.078-1.318 2.828S17.693 15 16.5 15H14a2 2 0 0 0-1 3.75A1.3 1.3 0 0 1 12 21" />
            <path d="M7.5 10.5a1 1 0 1 0 2 0 1 1 0 1 0-2 0m4-3a1 1 0 1 0 2 0 1 1 0 1 0-2 0m4 3a1 1 0 1 0 2 0 1 1 0 1 0-2 0" />
          </svg>
          <div class="color-picker-swatch" id="colorSwatch" style="background-color: {{defaultColor}};"></div>
          <input type="color" id="colorPicker" value="{{defaultColor}}" />
        </div>
        <div class="pick-object-icon ico-wrapper" id="objectPicker" title="Pick object">
          <svg stroke="currentColor" width="18" height="18" class="color-picker-icon" viewBox="0 0 24 24">
            <path d="M2.848,9.423 20.479,22.653 13.241,1.282 11.516,9.921Z" />
          </svg>
        </div>
        <div class="center-object-icon ico-wrapper" id="objectFit" title="Center selected object in view">
          <svg fill="none" width="18" height="18" stroke="currentColor" class="center-icon" viewBox="0 0 24 24">
            <path stroke="none" d="M0 0h24v24H0z" id="path1" />
            <g style="fill:none;stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round;stroke-opacity:1">
              <path d="m12,3v2m0,14v2m7,-9h2M5,12H3Z" />
              <path d="m8,8v8h8V8Z" />
              <path d="M1.66,12H4.26L4.33,13.73 6.66,12 4.3,10.26 4.26,12" />
              <path d="M12,1.66V4.26L10.26,4.33 12,6.66 13.73,4.33 12,4.26" />
              <path d="m22.33,11.99h-2.6l-0.06,-1.73 -2.33,1.73 2.33,1.73 0.06,-1.73" />
              <path d="m12,22.33v -2.6l1.73,-0.06 -1.73,-2.33 -1.73,2.33 1.73,0.06" />
            </g>
          </svg>
        </div>
      </div>
    </div>
    <div class="preview-content" id="preview">
      <div class="preview-svg-wrapper" id="svgWrapper">{{svgContent}}</div>
      <div id="objInfo"></div>
    </div>
  </div>

  <script src="{{scriptUri}}"></script>
</body>

</html>
